name: prospectai-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - prospectai_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - prospectai_redis_data:/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  gmaps-scraper:
    image: gosom/google-maps-scraper:latest
    restart: unless-stopped
    command: ["-data-folder", "/gmapsdata"]
    environment:
      DISABLE_TELEMETRY: "1"
    volumes:
      - /opt/data/prospectai/gmapsdata:/gmapsdata
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: infra/docker/api.prod.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gmaps-scraper:
        condition: service_started
    networks:
      internal:
      proxy_api:
        ipv4_address: 172.30.250.3
        aliases:
          - api-proxy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.prod.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gmaps-scraper:
        condition: service_started
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: infra/docker/web.prod.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      API_INTERNAL_URL: http://api:3101
    depends_on:
      - api
    networks:
      - internal

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      internal:
      proxy_api:
        ipv4_address: 172.30.250.2

  # Comando avulso com a imagem da API: migrations, seed, troca de senha.
  #
  # Existe porque `run --rm api` deixou de funcionar em 27/10 (`aba2ee7`): a
  # API ganhou IP fixo na `proxy_api`, e o container avulso disputa esse IP com
  # o que está rodando ("Address already in use", medido em 30/10). Este
  # serviço usa a mesma imagem, mas só a rede `internal` e sem IP fixo.
  #
  # Só existe com `--profile ops`: `up`, `build` e `pull` comuns o ignoram.
  #   $C --profile ops run --rm ops                      # migrate deploy
  #   $C --profile ops run --rm ops pnpm db:seed
  #   $C --profile ops run --rm ops pnpm db:senha EMAIL "motivo"
  #
  # `pull_policy: never`: a imagem vem do `$C build api`. Sem isto, imagem
  # ausente faria o Compose procurar `prospectai-prod-api` no Docker Hub — um
  # nome que qualquer pessoa pode registrar lá.
  ops:
    image: prospectai-prod-api:latest
    pull_policy: never
    profiles: ["ops"]
    env_file:
      - .env.production
    command: ["pnpm", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy_api:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/29
          gateway: 172.30.250.1

volumes:
  prospectai_postgres_data:
  prospectai_redis_data:
