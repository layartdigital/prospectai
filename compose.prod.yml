name: prospectai-prod

# Segredos por serviço — DB-REM-04 (SEC-DB-01.N), 30/10/2026.
#
# Até aqui todo serviço recebia o `.env.production` inteiro. Medido em 30/10
# (M1, só nomes): `api`, `worker` e `web` carregavam as sete chaves de banco,
# inclusive a senha do superusuário (`DATABASE_URL`, `POSTGRES_PASSWORD`) e a do
# migrator, que tem `BYPASSRLS`. Nenhum deles usa essas chaves. Uma execução de
# código em qualquer um entregava o banco inteiro.
#
# Agora são três arquivos, todos `600 root:root`, fora do Git e da imagem:
#
#   .env.production   comum (Redis, JWT, provedores); nenhuma credencial de banco
#   .env.banco        DATABASE_URL_APP, DATABASE_URL_SISTEMA — api, worker, ops
#   .env.dono         DATABASE_URL, DATABASE_URL_MIGRATOR, POSTGRES_*, SEED_*
#                     — postgres e ops
#
# Quem precisa do dono (migrate, seed, troca de senha) passa pelo `ops`.
# A regra é verificada no CI por `infra/scripts/checar-segredos-compose.sh`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Só o que a imagem do Postgres lê: POSTGRES_USER, POSTGRES_PASSWORD e
    # POSTGRES_DB (o resto do `.env.dono` vem junto e é inofensivo aqui — é o
    # próprio banco).
    env_file:
      - .env.dono
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - prospectai_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Só a própria senha, e não o arquivo inteiro. O `command` já a recebia por
    # interpolação; o healthcheck a lê do ambiente do container.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - prospectai_redis_data:/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  gmaps-scraper:
    image: gosom/google-maps-scraper:latest
    restart: unless-stopped
    command: ["-data-folder", "/gmapsdata"]
    environment:
      DISABLE_TELEMETRY: "1"
    volumes:
      - /opt/data/prospectai/gmapsdata:/gmapsdata
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: infra/docker/api.prod.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.banco
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gmaps-scraper:
        condition: service_started
    networks:
      internal:
      proxy_api:
        ipv4_address: 172.30.250.3
        aliases:
          - api-proxy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.prod.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.banco
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gmaps-scraper:
        condition: service_started
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: infra/docker/web.prod.Dockerfile
    restart: unless-stopped
    # Nenhuma credencial de banco: o front-end fala com a API, nunca com o
    # Postgres.
    env_file:
      - .env.production
    environment:
      API_INTERNAL_URL: http://api:3101
    depends_on:
      - api
    networks:
      - internal

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      internal:
      proxy_api:
        ipv4_address: 172.30.250.2

  # Comando avulso com a imagem da API: migrations, seed, troca de senha.
  #
  # Existe porque `run --rm api` deixou de funcionar em 27/10 (`aba2ee7`): a
  # API ganhou IP fixo na `proxy_api`, e o container avulso disputa esse IP com
  # o que está rodando ("Address already in use", medido em 30/10). Este
  # serviço usa a mesma imagem, mas só a rede `internal` e sem IP fixo.
  #
  # Só existe com `--profile ops`: `up`, `build` e `pull` comuns o ignoram.
  #   $C --profile ops run --rm ops                      # migrate deploy
  #   $C --profile ops run --rm ops pnpm db:seed
  #   $C --profile ops run --rm ops pnpm db:senha EMAIL "motivo"
  #
  # `pull_policy: never`: a imagem vem do `$C build api`. Sem isto, imagem
  # ausente faria o Compose procurar `prospectai-prod-api` no Docker Hub — um
  # nome que qualquer pessoa pode registrar lá.
  ops:
    image: prospectai-prod-api:latest
    pull_policy: never
    profiles: ["ops"]
    # O único serviço com os três arquivos: é por aqui que passa o dono.
    env_file:
      - .env.production
      - .env.banco
      - .env.dono
    command: ["pnpm", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy_api:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/29
          gateway: 172.30.250.1

volumes:
  prospectai_postgres_data:
  prospectai_redis_data:
