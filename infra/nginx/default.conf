# O gateway descobre o endereco de `api` e `web` a cada 10 segundos, e nao uma
# vez so, quando liga.
#
# Com `proxy_pass http://api:3101` literal, o nginx resolve o nome na partida e
# guarda o IP para sempre. Em 22/09/2026 a API foi recriada no deploy, ganhou
# outro IP na rede Docker, e o gateway — no ar havia 5 semanas — continuou
# mandando o login para o endereco antigo: a tela de login abria e nenhum login
# chegava a API. Resolvido na hora reiniciando o gateway; resolvido aqui para
# nao depender de lembrar disso a cada deploy.
#
# 127.0.0.11 e o DNS interno do Docker. Com o nome numa variavel, o nginx
# consulta o resolver em tempo de requisicao (respeitando `valid`) e tambem
# sobe mesmo se `api` ainda nao existir. Como `proxy_pass` com variavel e sem
# caminho repassa a URI original inteira, o comportamento das rotas e o mesmo
# de antes.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    set $upstream_api http://api:3101;
    set $upstream_web http://web:3100;

    location /api/ {
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
