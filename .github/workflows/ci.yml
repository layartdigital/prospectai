name: CI

# Primeiro pipeline do projeto — 04/09/2026.
#
# =============================================================================
# Por que ele nao existia, e por que isso importava mais do que parecia
# =============================================================================
#
# Ate hoje, **nenhuma garantia deste repositorio tinha gatilho.** As 34 politicas
# de RLS, os 399 testes e as verificacoes de catalogo da fase B so rodavam quando
# alguem digitava o comando. Um push que quebrasse qualquer uma delas passava.
#
# O item aparecia nas notas do programa RLS como "`typecheck:all` antes de `test`
# no CI, ainda sem dono" — o que descrevia um pipeline existente precisando de um
# ajuste de ordem. Nao era isso: nao havia pipeline. A frase foi repetida oito
# vezes sem ninguem abrir o diretorio.
#
# =============================================================================
# Dois jobs, e a ordem entre eles e o ponto
# =============================================================================
#
# `tipos` nao depende de banco nenhum e termina em menos de um minuto. `testes`
# depende dele por `needs:`.
#
# **Isso e estrutural, e nao uma sequencia de passos que alguem reordena sem
# perceber.** Oito vezes ao longo do programa RLS um erro de tipo foi
# diagnosticado primeiro como falha de teste, porque a suite rodou antes do
# compilador. O caso mais caro: um `PrismaClient` cru passado como `prisma as
# never` — o `never` calava o compilador exatamente na fronteira que teria
# acusado o problema, e 56 testes cairam com "comTenant is not a function".
#
# O custo e uma segunda instalacao de dependencias, amortizada pelo cache do
# pnpm. O beneficio e que erro de tipo se chama erro de tipo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# P04-QA-02 (31/10/2026): este workflow so LE o repositorio. Nao ha deploy, SSH,
# acesso ao servidor de producao nem segredo de producao em nenhum job: os bancos
# sao efemeros (servico do runner) e todas as credenciais abaixo sao descartaveis.
permissions:
  contents: read

# Um push novo cancela a execucao anterior do mesmo ramo. A suite leva ~6 min e
# nao ha valor em terminar a verificacao de um commit ja substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `NODE_VERSION` e o Node **do projeto**, e nao o runtime das acoes — sao
  # coisas diferentes. O `package.json` declara `engines.node`; divergir aqui
  # produziria um CI que verifica um ambiente que ninguem usa.
  #
  # A distincao acima importou em 09/09/2026, quando quase misturamos duas
  # coisas: **o prazo de 23/09 e do runtime das acoes** (o `runs: using:` de
  # `checkout`, `setup-node` e afins), e nao deste valor. Este aqui nao tinha
  # data nenhuma — tinha coisa pior, que era estar **sem correcao de seguranca
  # desde 30/04/2026**, quando o Node 20 morreu. Prazo que ninguem cobra e o
  # que fica para depois indefinidamente.
  #
  # ---
  #
  # **Por que 24, e por que so o major.**
  #
  # O Node 24 e o Active LTS de hoje: vira Maintenance em 20/10/2026 e so morre
  # em 30/04/2028. E e o que os runners do GitHub ja usam por padrao desde
  # 16/06/2026, entao o CI passa a ter um ambiente so em vez de dois.
  #
  # As alternativas, e o motivo de nao serem: o **22** ja esta em Maintenance e
  # morre em 30/04/2027, o que seria trocar divida vencida por divida vencendo;
  # o **26** dura ate 2029 mas so vira LTS em outubro, e seis semanas de CI numa
  # versao `Current` e risco sem retorno quando o 24 cobre dezenove meses.
  #
  # **`'24'` e nao `'24.x.y'`, de proposito.** O valor antigo era `'20.11'`, um
  # minor fixo — e fixar minor congela justamente a correcao de seguranca que
  # este commit existe para voltar a receber. O `setup-node` resolve `'24'` como
  # o 24 mais recente a cada execucao.
  #
  # ⚠ O que isto **pode** quebrar e modulo nativo: o `@node-rs/argon2` traz
  # binario compilado. Ele usa N-API, que e estavel entre majors, entao a
  # expectativa e que nao doa — mas expectativa nao e medicao, e quem mede e a
  # execucao do CI logo abaixo.
  #
  # A variavel do pnpm saiu em 04/09: o `package.json` ja declara
  # `packageManager: pnpm@10.30.1`, e a acao le isso sozinha. Fixar nos dois
  # lugares duplicava a fonte da verdade, e as duas podiam divergir calada.
  NODE_VERSION: '24'

jobs:
  # ===========================================================================
  tipos:
    name: Tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # DB-REM-04 (30/10/2026): cada servico do `compose.prod.yml` so recebe as
      # credenciais de banco que usa. Roda antes da instalacao porque nao
      # depende dela — so do `docker compose` e do `jq` do runner — e falha em
      # segundos. Arquivos de ambiente falsos, numa pasta temporaria.
      - name: Segredos por servico (compose.prod.yml)
        run: bash infra/scripts/checar-segredos-compose.sh

      # v6, e sem `with: version` — ver o bloco `env`.
      #
      # ⚠ Esta acao tem sucessor: a v6.0.10 aponta os usuarios para `pnpm/setup`.
      # Continua mantida (a v6.1.0 e de 01/09 e ja suporta pnpm 12), entao a
      # troca nao e urgente — e trocar de acao no mesmo commit que sobe tres
      # versoes misturaria duas coisas.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `prisma generate` antes do typecheck: o client tipado e gerado, nao
      # versionado. Sem ele, o typecheck falha em todo lugar que toca o banco —
      # e a mensagem nao diz que o motivo e a geracao faltando.
      - run: pnpm db:generate

      # `typecheck:all`, e nao `typecheck`: o primeiro cobre tambem os testes e
      # os scripts (`tsconfig.tests.json`, `tsconfig.scripts.json`), e foi em
      # arquivo de teste que os defeitos apareceram.
      - name: Typecheck completo (fontes, testes e scripts)
        run: pnpm typecheck:all

      # P04-QA-02: lint e passo obrigatorio. Sem `continue-on-error`: qualquer
      # erro de ESLint/`next lint` derruba o job e, por `needs:`, tudo o que
      # vem depois.
      - name: Lint
        run: pnpm lint

  # ===========================================================================
  # P04-QA-02 (31/10/2026): builds de producao da API e da web.
  #
  # Separados do job `testes` de proposito: aquele define `NODE_ENV=test` no
  # nivel do job, e `next build` recusa/avisa com NODE_ENV nao padrao. Aqui
  # NODE_ENV nao e definido, e cada build roda pelo turbo para que `^build`
  # (o pacote `@propectai/types`) seja construido antes.
  # ===========================================================================
  builds:
    name: Builds (API e web)
    runs-on: ubuntu-latest
    needs: tipos
    env:
      APP_VERSION: ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Build da API (nest build)
        run: pnpm exec turbo run build --filter=@propectai/api

      - name: Build da web (next build)
        run: pnpm exec turbo run build --filter=@propectai/web

  # ===========================================================================
  testes:
    name: Testes e verificacao de RLS
    runs-on: ubuntu-latest
    needs: tipos

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # **`propectai` nao e escolha de estilo.** A migration
          # `20260826230000_rls_papeis` faz
          # `ALTER DEFAULT PRIVILEGES FOR ROLE propectai`, com o nome literal.
          # Com outro dono, os privilegios padrao nao se aplicam e toda tabela
          # criada por migration futura nasce invisivel para o `propectai_app` —
          # sintoma "permission denied" numa rota que funcionava ontem.
          POSTGRES_USER: propectai
          POSTGRES_PASSWORD: propectai_ci_only
          POSTGRES_DB: propectai
        ports:
          # 5434 para manter uma forma so de URL entre CI e a maquina de quem
          # desenvolve. Em CI nao ha o Bellvia a evitar — que e o motivo do
          # deslocamento no `.env.example` —, mas duas formas de URL custam mais
          # do que a linha economizada.
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U propectai -d propectai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_VERSION: ci

      # As quatro URLs. As tres de papel sao o que faz a suite de RLS provar
      # alguma coisa. Sem `DATABASE_URL_APP` ou `DATABASE_URL_SISTEMA`, a API e
      # o worker recusam criar o client (DB-REM-01) e a suite quebra alto; ate
      # entao caiam no dono e todo teste de isolamento passava **de graca**.
      #
      # O que este arquivo nao pega e a variavel presente apontando para o
      # dono. Contra isso continua valendo a pre-condicao
      # `current_user = 'propectai_app'` que abre cada `rls-*.spec.ts`. Ela
      # existe justamente porque este erro e silencioso.
      DATABASE_URL: postgresql://propectai:propectai_ci_only@localhost:5434/propectai?schema=public
      DATABASE_URL_MIGRATOR: postgresql://propectai_migrator:migrator_ci_only@localhost:5434/propectai?schema=public
      DATABASE_URL_APP: postgresql://propectai_app:app_ci_only@localhost:5434/propectai?schema=public
      DATABASE_URL_SISTEMA: postgresql://propectai_sistema:sistema_ci_only@localhost:5434/propectai?schema=public

      REDIS_URL: redis://localhost:6381

      # Valores descartaveis. **Nao sao segredos, e nao devem virar secrets do
      # repositorio:** o banco vive dentro de um job, nao aceita conexao de fora
      # e e destruido ao fim. Guardar isto como secret daria a impressao de que
      # ha algo a proteger aqui, e diluiria a atencao dos segredos que existem.
      JWT_ACCESS_SECRET: ci-access-nao-e-segredo-nao-sai-do-job
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: 'false'

      # As senhas do seed, uma por papel. **Descartaveis, como as de cima.**
      #
      # Acrescentadas em 25/09/2026, depois de o proprio CI pegar o efeito
      # colateral de `7d8db3b`: o seed passou a exigir `SEED_OWNER_PASSWORD` e
      # `SEED_SDR_PASSWORD`, o job nao as definia, e `Semear o catalogo` falhou
      # - parando a suite e o portao de RLS antes de comecarem.
      #
      # Precisam ser **diferentes entre si** e ter 12 caracteres ou mais: sao as
      # duas regras que `pessoasDoSeed` impoe, e deixa-las aqui faz o CI
      # exercitar a regra em vez de contorna-la.
      SEED_OWNER_PASSWORD: ci-owner-descartavel-nao-e-segredo
      SEED_SDR_PASSWORD: ci-sdr-descartavel-e-diferente-do-outro

      # `mock` nos dois. O padrao seguro e o que nao sai para a internet, e um CI
      # que dependesse do Google Maps falharia por motivo alheio ao commit.
      LEAD_SOURCE_PROVIDER: mock
      SITE_AUDIT_PROVIDER: mock
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v7

      # v6, e sem `with: version` — ver o bloco `env`.
      #
      # ⚠ Esta acao tem sucessor: a v6.0.10 aponta os usuarios para `pnpm/setup`.
      # Continua mantida (a v6.1.0 e de 01/09 e ja suporta pnpm 12), entao a
      # troca nao e urgente — e trocar de acao no mesmo commit que sobe tres
      # versoes misturaria duas coisas.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `@propectai/types` e compilado, e `dist/` nao e versionado — num
      # ambiente limpo ele nao existe.
      #
      # **Encontrado pela execucao #1**, que morreu aqui com
      # "Cannot find module '@propectai/types/dist/index.js'".
      #
      # O job `tipos` nao tropeca nisto porque `turbo run typecheck` tem
      # `dependsOn: ["^build"]` e constroi a dependencia sozinho. O `db:seed`
      # **nao passa pelo turbo**: e script de raiz que roda `tsx
      # prisma/seed.ts`, e o seed importa `@propectai/types`. A dependencia
      # existia e nao estava declarada em lugar nenhum fora do turbo.
      #
      # Vale igual para clone novo na maquina de quem desenvolve: `pnpm install`
      # seguido de `pnpm db:seed` falha do mesmo jeito. O CI achou um defeito de
      # onboarding no primeiro dia.
      #
      # `--filter` em vez de `pnpm build`: o segundo construiria tambem o
      # Next.js do `@propectai/web`, que nada aqui usa.
      - name: Compilar o pacote de tipos
        run: pnpm --filter @propectai/types build

      - run: pnpm db:generate

      # `migrate deploy`, e nao `migrate dev`: o segundo cria shadow database,
      # compara desvio e faz perguntas. Em CI nada disso e desejavel, e a
      # ausencia de terminal transformaria uma pergunta em travamento.
      #
      # **Dois estagios desde o DB-REM-06 (30/10/2026).** Em producao, as
      # migrations ate a `20261030190000_dono_sem_superusuario` rodaram como
      # superusuario; as seguintes rodam como `propectai_dono`, que nao e. O CI
      # repete isso: sem o segundo estagio, uma migration futura que so funciona
      # como superusuario (criar papel, por exemplo) passaria aqui e quebraria
      # no servidor.
      #
      # O primeiro estagio copia o schema e as migrations ate a do DB-REM-06
      # para uma pasta temporaria e aplica so essas, como `propectai`. O
      # segundo aplica o resto pela pasta normal: o Prisma pula as ja
      # registradas em `_prisma_migrations` (os arquivos sao os mesmos, entao o
      # checksum bate).
      - name: Aplicar migrations ate o DB-REM-06 (superusuario)
        run: |
          ULTIMA=20261030190000_dono_sem_superusuario
          test -d "prisma/migrations/$ULTIMA"
          T="$RUNNER_TEMP/migrations-superusuario"
          mkdir -p "$T/migrations"
          cp prisma/schema.prisma "$T/"
          cp prisma/migrations/migration_lock.toml "$T/migrations/"
          for d in prisma/migrations/*/; do
            n="$(basename "$d")"
            cp -r "$d" "$T/migrations/$n"
            [ "$n" = "$ULTIMA" ] && break
          done
          [ "$(basename "$(ls -d "$T"/migrations/*/ | tail -1)")" = "$ULTIMA" ]
          echo "estagio 1: $(ls -d "$T"/migrations/*/ | wc -l) migrations, ate $ULTIMA"
          pnpm exec prisma migrate deploy --schema "$T/schema.prisma"

      # ---------------------------------------------------------------------
      - name: Dar senha aos quatro papeis
        # **As migrations criam os papeis SEM senha, e isso e proposital** — o
        # repositorio nao ganha um segredo. O comentario final da
        # `20260826230000_rls_papeis` justifica dizendo que "o Postgres local do
        # projeto autentica por confianca".
        #
        # **Essa frase e falsa, e a migration nao pode ser editada** (o Prisma
        # valida o checksum de migration aplicada). O `pg_hba.conf` da imagem
        # confia apenas no socket local e no `127.0.0.1` de dentro do container;
        # conexao vinda de fora chega pelo gateway da ponte Docker e cai em
        # `scram-sha-256`. **Isso inclui o dono.**
        #
        # Aqui os testes conectam de fora do container, entao sem este passo os
        # tres papeis nao logam — e o sintoma seria "Authentication failed",
        # tres arquivos longe da causa.
        #
        # Este e tambem o item 3 do checklist de primeiro deploy, exercitado
        # pela primeira vez: as tres credenciais existem antes de qualquer
        # conexao.
        env:
          PGPASSWORD: propectai_ci_only
        run: |
          psql -h localhost -p 5434 -U propectai -d propectai -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE propectai_migrator PASSWORD 'migrator_ci_only';
          ALTER ROLE propectai_app       PASSWORD 'app_ci_only';
          ALTER ROLE propectai_sistema   PASSWORD 'sistema_ci_only';
          ALTER ROLE propectai_dono      PASSWORD 'dono_ci_only';
          SQL

      # ---------------------------------------------------------------------
      - name: Aplicar as migrations seguintes (propectai_dono)
        # Segundo estagio do DB-REM-06 — ver o comentario do primeiro. Hoje
        # pode nao haver nenhuma migration depois da do DB-REM-06; o passo roda
        # do mesmo jeito, e o `migrate deploy` confirma que nada ficou pendente.
        env:
          DATABASE_URL: postgresql://propectai_dono:dono_ci_only@localhost:5434/propectai?schema=public
        run: pnpm db:deploy

      # ---------------------------------------------------------------------
      - name: Semear o catalogo
        # O `rls-conta.spec.ts` precisa de um `Plan`, que e catalogo global e
        # fica fora das familias de RLS; o `suspension-rules.spec.ts` declara a
        # dependencia no proprio cabecalho. Criar um plano dentro do teste
        # poluiria o catalogo com uma linha que nao cai por cascade de tenant.
        run: pnpm db:seed

      # ---------------------------------------------------------------------
      # P04-QA-02: o teste HTTP de isolamento do Intelligence Explorer roda
      # sozinho e primeiro, como passo proprio. Se ele cair, o log aponta o
      # Explorer direto em vez de se perder entre os ~400 testes da suite.
      # Mesmo codigo da suite completa: nao ha mock de Prisma — banco real,
      # papel `propectai_app` (sem BYPASSRLS) e requisicoes HTTP reais.
      - name: Isolamento HTTP do Intelligence Explorer
        run: pnpm --filter @propectai/api exec jest test/intelligence-tenant.spec.ts --runInBand

      # ---------------------------------------------------------------------
      - name: Suite completa
        run: pnpm test

      # ---------------------------------------------------------------------
      - name: Portao de RLS
        # **A parte que faz a verificacao da fase B valer alguma coisa.**
        #
        # O `verificacoes-fase-b.sql` imprime tabelas para uma pessoa ler — util
        # em diagnostico, inutil como gatilho: `psql` sai com 0 tendo impresso
        # qualquer coisa. O `gate-rls.sql` faz as mesmas perguntas e **lanca
        # excecao** quando a resposta e errada.
        #
        # Ele nao afirma "34 tabelas". Afirma invariantes estruturais, e por isso
        # sobrevive a tabela nova: uma tabela escopada criada daqui a seis meses
        # sem politica derruba este passo sem que ninguem precise ter lembrado
        # de acrescenta-la a lista nenhuma.
        env:
          PGPASSWORD: propectai_ci_only
        run: |
          psql -h localhost -p 5434 -U propectai -d propectai \
               -v ON_ERROR_STOP=1 \
               -f docs/intelligence/gate0/gate-rls.sql

      # ---------------------------------------------------------------------
      - name: Relatorio de RLS
        # Roda **sempre**, inclusive quando o portao acima falhou — e e nesse
        # caso que ele importa: o portao diz que quebrou, este diz o que esta
        # no lugar. Nao falha o build sozinho.
        if: always()
        env:
          PGPASSWORD: propectai_ci_only
        run: |
          psql -h localhost -p 5434 -U propectai -d propectai \
               -f docs/intelligence/gate0/verificacoes-fase-b.sql

  # ===========================================================================
  # P04-QA-04: E2E REAL. Navegador (Chromium/Playwright) contra a aplicacao
  # inteira, em build de producao, num banco efemero que nasce e morre no job:
  #
  #   PostgreSQL 16 (servico do job) <- NestJS (node apps/api/dist/main.js)
  #        ^ migrations em dois estagios + seed + fixtures   |
  #                                                          v
  #   Chromium -> gateway :3100 --/api--> API :3101
  #                          \--resto--> Next.js (next start) :3200
  #
  # O gateway e o equivalente do nginx de producao (uma origem so, `/api` para a
  # API). Ele repassa tudo para a aplicacao real; nao responde nada sozinho.
  # Nao ha Prisma simulado, Next emulado, resposta HTTP artificial nem
  # autenticacao ficticia. Nao ha `continue-on-error`, `|| true`, nem
  # `test.skip`: se um teste obrigatorio cai, o job cai e o "Resultado do CI"
  # cai junto. Nenhum segredo do repositorio e usado e nada aqui toca producao.
  # ===========================================================================
  e2e:
    name: E2E real (Playwright)
    runs-on: ubuntu-latest
    needs: tipos
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: propectai
          POSTGRES_PASSWORD: propectai_ci_only
          POSTGRES_DB: propectai
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U propectai -d propectai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `APP_VERSION` NAO e definida de proposito: o rodape mostra "v0.1.1" na
      # API e na web (o teste do fluxo 1 confere). Os jobs `builds` e `testes`
      # usam `ci`; aqui o produto roda como roda no servidor.
      NEXT_TELEMETRY_DISABLED: '1'

      DATABASE_URL: postgresql://propectai:propectai_ci_only@localhost:5434/propectai?schema=public
      DATABASE_URL_MIGRATOR: postgresql://propectai_migrator:migrator_ci_only@localhost:5434/propectai?schema=public
      DATABASE_URL_APP: postgresql://propectai_app:app_ci_only@localhost:5434/propectai?schema=public
      DATABASE_URL_SISTEMA: postgresql://propectai_sistema:sistema_ci_only@localhost:5434/propectai?schema=public
      REDIS_URL: redis://localhost:6381

      # Valores descartaveis, como nos outros jobs: o banco morre com o job e
      # nao aceita conexao de fora. Nao sao segredos e nao viram secrets.
      JWT_ACCESS_SECRET: ci-access-nao-e-segredo-nao-sai-do-job
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      COOKIE_DOMAIN: localhost
      # A origem do E2E e HTTP; cookie `Secure` nao seria devolvido pelo navegador.
      COOKIE_SECURE: 'false'
      SEED_OWNER_PASSWORD: ci-owner-descartavel-nao-e-segredo
      SEED_SDR_PASSWORD: ci-sdr-descartavel-e-diferente-do-outro
      # Senha do usuario do workspace Beta (fixtures). Descartavel e diferente das outras.
      E2E_BETA_PASSWORD: ci-beta-descartavel-e-so-deste-job

      LEAD_SOURCE_PROVIDER: mock
      SITE_AUDIT_PROVIDER: mock
      AI_PROVIDER: mock

      API_PORT: '3101'
      WEB_ORIGIN: http://localhost:3100
      API_INTERNAL_URL: http://127.0.0.1:3101
      E2E_BASE_URL: http://localhost:3100
      E2E_LOGS: ${{ github.workspace }}/e2e-logs

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compilar o pacote de tipos
        run: pnpm --filter @propectai/types build

      - run: pnpm db:generate

      # ---- banco efemero: mesmas etapas do job `testes` -------------------
      - name: Aplicar migrations ate o DB-REM-06 (superusuario)
        run: |
          ULTIMA=20261030190000_dono_sem_superusuario
          test -d "prisma/migrations/$ULTIMA"
          T="$RUNNER_TEMP/migrations-superusuario"
          mkdir -p "$T/migrations"
          cp prisma/schema.prisma "$T/"
          cp prisma/migrations/migration_lock.toml "$T/migrations/"
          for d in prisma/migrations/*/; do
            n="$(basename "$d")"
            cp -r "$d" "$T/migrations/$n"
            [ "$n" = "$ULTIMA" ] && break
          done
          [ "$(basename "$(ls -d "$T"/migrations/*/ | tail -1)")" = "$ULTIMA" ]
          pnpm exec prisma migrate deploy --schema "$T/schema.prisma"

      - name: Dar senha aos quatro papeis
        env:
          PGPASSWORD: propectai_ci_only
        run: |
          psql -h localhost -p 5434 -U propectai -d propectai -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE propectai_migrator PASSWORD 'migrator_ci_only';
          ALTER ROLE propectai_app       PASSWORD 'app_ci_only';
          ALTER ROLE propectai_sistema   PASSWORD 'sistema_ci_only';
          ALTER ROLE propectai_dono      PASSWORD 'dono_ci_only';
          SQL

      - name: Aplicar as migrations seguintes (propectai_dono)
        env:
          DATABASE_URL: postgresql://propectai_dono:dono_ci_only@localhost:5434/propectai?schema=public
        run: pnpm db:deploy

      - name: Semear o catalogo e o workspace de demonstracao (Alfa)
        run: pnpm db:seed

      - name: Fixtures sinteticas do E2E (Alfa enriquecido e Beta)
        run: pnpm db:e2e-fixtures

      # ---- builds de producao ---------------------------------------------
      - name: Build da API (nest build)
        run: pnpm --filter @propectai/api build

      - name: Build da web (next build)
        run: pnpm --filter @propectai/web build

      - name: Instalar o Chromium do Playwright
        run: pnpm --filter @propectai/web exec playwright install --with-deps chromium

      # ---- pilha real: API + Next + gateway -------------------------------
      - name: Iniciar a API (build de producao, so com as credenciais de runtime)
        # `env -u` tira do processo da API as URLs do superusuario e do
        # migrator: ela sobe como no servidor, apenas com `propectai_app` e
        # `propectai_sistema`. Se algum caminho ainda dependesse do dono, o
        # login quebraria aqui em vez de passar escondido.
        run: |
          mkdir -p "$E2E_LOGS"
          NODE_ENV=production env -u DATABASE_URL -u DATABASE_URL_MIGRATOR \
            nohup node apps/api/dist/main.js > "$E2E_LOGS/api.log" 2>&1 &
          echo $! > "$E2E_LOGS/api.pid"

      - name: Iniciar o Next.js (next start)
        run: |
          NODE_ENV=production nohup pnpm --filter @propectai/web exec next start --port 3200 \
            > "$E2E_LOGS/web.log" 2>&1 &
          echo $! > "$E2E_LOGS/web.pid"

      - name: Iniciar o gateway same-origin
        run: |
          GATEWAY_PORT=3100 WEB_TARGET_PORT=3200 API_TARGET_PORT=3101 \
            nohup node apps/web/e2e/ci/gateway.mjs > "$E2E_LOGS/gateway.log" 2>&1 &
          echo $! > "$E2E_LOGS/gateway.pid"

      - name: Esperar a pilha responder (API, web e /api pelo gateway)
        run: |
          esperar() {
            for i in $(seq 1 90); do
              if curl -fsS -o /dev/null "$2"; then echo "ok: $1 ($2) apos ${i} tentativa(s)"; return 0; fi
              sleep 2
            done
            echo "FALHOU: $1 nao respondeu em $2" >&2
            return 1
          }
          esperar "API direta"   http://127.0.0.1:3101/api/v1/health
          esperar "Next direto"  http://127.0.0.1:3200/login
          esperar "Gateway /api" http://127.0.0.1:3100/api/v1/health
          esperar "Gateway web"  http://127.0.0.1:3100/login
          echo "--- /api/v1/health pelo gateway ---"
          curl -fsS http://127.0.0.1:3100/api/v1/health; echo

      # ---- Playwright ------------------------------------------------------
      # O Explorer roda ANTES da regressao: os fluxos antigos escrevem no lead
      # de maior score do tenant de demonstracao, que pode ser o lead-hub das
      # fixtures, e as contagens exatas (11 notas, 4 atividades...) dependem de
      # ele estar intacto.
      - name: E2E-01 a E2E-08 - Intelligence Explorer
        working-directory: apps/web
        env:
          E2E_RESULTS_DIR: test-results-ci-explorer
        run: pnpm exec playwright test -c playwright.ci.config.ts explorer-

      # `!cancelled()`: a regressao roda mesmo se o Explorer reprovar, para o
      # relatorio mostrar os dois lados. Nao e `continue-on-error`: o passo
      # anterior reprovado reprova o job.
      - name: E2E-09 - regressao do produto (fluxos 0 a 4 existentes)
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          E2E_RESULTS_DIR: test-results-ci-regressao
        run: pnpm exec playwright test -c playwright.ci.config.ts fluxo-

      # ---- logs e evidencias (sempre) -------------------------------------
      - name: Encerrar a pilha e conferir os logs de inicializacao e desligamento
        if: always()
        run: |
          for nome in gateway web api; do
            if [ -f "$E2E_LOGS/$nome.pid" ]; then
              pid="$(cat "$E2E_LOGS/$nome.pid")"
              if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid"; fi
            fi
          done
          sleep 3
          for nome in api web gateway; do
            echo "================ $nome.log (ultimas 60 linhas) ================"
            tail -n 60 "$E2E_LOGS/$nome.log" 2>/dev/null || echo "(sem log)"
          done

      - name: Resumo dos testes (contagem por estado)
        if: always()
        run: |
          for r in explorer regressao; do
            f="apps/web/test-results-ci-$r/resultado.json"
            if [ -f "$f" ]; then
              node -e '
                const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const s = r.stats ?? {};
                console.log(process.argv[2] + ": esperados(passaram)=" + s.expected + " inesperados(falharam)=" + s.unexpected + " instaveis=" + s.flaky + " pulados=" + s.skipped);
              ' "$f" "$r"
            else
              echo "$r: sem resultado.json (o passo nao chegou a rodar)"
            fi
          done

      # Sanitizacao: nada com senha ou cookie de sessao pode ser publicado. Se a
      # varredura achar qualquer um, o job cai e a publicacao e PULADA.
      - name: Varredura de sanitizacao das evidencias
        id: sanitizacao
        if: always()
        run: |
          if grep -rIlF \
               -e "$SEED_OWNER_PASSWORD" -e "$SEED_SDR_PASSWORD" -e "$E2E_BETA_PASSWORD" \
               -e "pa_at=" -e "pa_rt=" -e "Set-Cookie" -e "set-cookie" \
               apps/web/test-results-ci-explorer apps/web/test-results-ci-regressao e2e-logs 2>/dev/null; then
            echo "SANITIZACAO FALHOU: os arquivos acima contem senha ou cookie." >&2
            exit 1
          fi
          echo "sanitizacao ok: nenhuma senha de CI nem cookie de sessao nas evidencias"

      - name: Publicar evidencias (capturas, relatorio JSON/HTML e logs)
        if: ${{ always() && steps.sanitizacao.outcome != 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidencias
          if-no-files-found: warn
          retention-days: 30
          path: |
            apps/web/test-results-ci-explorer/**
            apps/web/test-results-ci-regressao/**
            e2e-logs/*.log
            !**/*.zip
            !**/trace*

  # ===========================================================================
  # P04-QA-02: ponto unico para "required status check". `if: always()` para que
  # ele rode (e falhe) mesmo quando um job anterior foi pulado por falha de
  # `needs:` — um job pulado nao reprova sozinho, e sem este portao um PR com
  # `tipos` vermelho poderia mostrar so "skipped" nos demais.
  # ===========================================================================
  resultado:
    name: Resultado do CI
    runs-on: ubuntu-latest
    if: always()
    needs: [tipos, builds, testes, e2e]
    steps:
      - name: Todos os jobs obrigatorios precisam ter passado
        env:
          TIPOS: ${{ needs.tipos.result }}
          BUILDS: ${{ needs.builds.result }}
          TESTES: ${{ needs.testes.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "tipos=$TIPOS builds=$BUILDS testes=$TESTES e2e=$E2E"
          [ "$TIPOS" = "success" ] && [ "$BUILDS" = "success" ] && [ "$TESTES" = "success" ] && [ "$E2E" = "success" ]
